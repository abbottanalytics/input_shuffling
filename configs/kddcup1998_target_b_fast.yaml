# Input Shuffling v2 configuration file
# input_shuffling_v2 — kddcup1998 TARGET_B, fast config (n_shuffles=10)
# All v2 analysis layers enabled. Compatible with the v0.6 config spec.
version: "2.0"

run:
  name: "input_shuffling_v2_target_b_fast"
  output_dir: "runs"
  overwrite: false
  seed: 12345

data:
  path: "kddcup1998/runs/model_ef06f3ce5d6a/scored_test.parquet"
  format: "parquet"
  read_options:
    columns: null
    filters: null

schema:
  id_column: "RECORD_ID"
  target_column: "TARGET_B"
  target_type: "binary"
  positive_label: 1
  feature_columns: []                  # [] => auto-load from model_info.json
  meta_columns: ["STATE", "RFA_2"]
  prediction_columns: []               # [] => derived: TARGET_B_prob

sampling:
  use: "all"                           # all|sample_n|sample_frac
  sample_n: null
  sample_frac: null
  stratify_by: null
  replace: false
  seed_offset: 0

shuffling:
  n_shuffles: 10
  shuffle_scope: "global"
  shuffle_method: "permute"
  seed_strategy: "deterministic"

importance:
  enabled: true
  eps: 0.01
  ranking_stat: "mean_record_iqr"      # v2 default (chapter recommendation)

scoring:
  plugin:
    module: "kddcup1998.scoring_target_b"
    function: "predict"
    info_function: "model_info"
  model:
    path: "kddcup1998/runs/model_ef06f3ce5d6a/model.joblib"
  baseline:
    use_existing_predictions: true
  batch_size: null                     # rows per scoring call (null = all at once)

# NEW in v2: performance controls
performance:
  n_jobs: 1                            # >1 => parallel feature scoring (processes)
  shuffle_batch: 10                    # shuffles stacked per scoring call

# Classic permutation importance via metric degradation (requires target)
metric_drop:
  enabled: true
  metrics:
    binary: ["roc_auc", "logloss", "f1", "accuracy", "lift_at_decile"]
    regression: ["rmse", "mae", "r2"]
  thresholding:
    enabled: true
    method: "fixed_or_prior"
    fixed_threshold: null
    optimize_metric: "f1"
    search: { grid_size: 200, range: [0.0, 1.0] }
  ranking_metric:
    name: "roc_auc"
    direction: "higher_is_better"
  lift_settings:
    decile: 1                          # cumulative lift in top decile
  summary_stats:
    include: ["mean", "std", "se", "median", "iqr"]

# Record-level instability outliers
record_outliers:
  enabled: true
  variability_stat: "iqr"              # variance|std|iqr|mad
  aggregation_across_features: "mean"  # mean|median|max|p90
  output_top_outliers:
    enabled: true
    top_n: 200
    include_meta: true
    include_top_features:
      enabled: true
      top_k: 5

bucketing:
  enabled: true
  always_include_all: true
  mode: "aggregate"                    # within_bucket (v1-compatible) | aggregate (fast)
  bucket_stats:
    enabled: true
  specs:
    - name: "pred_decile"
      by: "prediction"
      columns: "ALL_MODELS"
      scheme: { type: "quantile", q: 10 }
    - name: "pred_top5pct"
      by: "prediction"
      columns: "ALL_MODELS"
      scheme: { type: "top_pct", pct: 0.05 }
    - name: "pred_bottom5pct"
      by: "prediction"
      columns: "ALL_MODELS"
      scheme: { type: "bottom_pct", pct: 0.05 }
    - name: "by_rfa2"
      by: "meta"
      columns: ["RFA_2"]
      scheme: { type: "categories", min_count: 1000, other_label: "__OTHER__" }

# Bootstrap stability of the importance ranking
stability:
  enabled: true
  resampling:
    method: "bootstrap"
    B: 100
    bootstrap:
      sample_frac: 1.0
      stratify_by: null
  rankings_to_check: ["importance", "metric_drop"]
  metrics:
    top_k_jaccard: { enabled: true, k: 10 }
    bottom_k_jaccard: { enabled: true, k: 10 }
    spearman: { enabled: true }
    kendall_tau: { enabled: true }
    pairwise_order_consistency: { enabled: true, Z: 0.90 }
  consensus_ranking:
    method: "median_rank"
    tie_breaker: "mean_value"

reporting:
  write_parquet: true
  write_csv: true
  write_markdown_report: true
  report_sections:
    - "baseline_metrics"
    - "baseline_target_distribution"
    - "importance"
    - "metric_drop"
    - "record_outliers"
    - "bucketing"
    - "stability"
  logging:
    level: "INFO"
