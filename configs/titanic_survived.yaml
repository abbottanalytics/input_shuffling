# Input Shuffling v2 configuration file
# input_shuffling_v2 — titanic survived, full config (n_shuffles=50)
# Model: CART baseline (model_98a696d7e25a) built by modelkit.run_classification_models
# on prep_4bd1fe370b93 — same spec as the original model_52dc2f700edf (AUC 0.834).
# Uses the built-in generic sklearn plugin (no scoring.plugin section needed).
version: "2.0"

run:
  name: "input_shuffling_v2_titanic_survived"
  output_dir: "runs"
  overwrite: false
  seed: 12345

data:
  path: "titanic/runs/model_98a696d7e25a/scored_test.parquet"
  format: "parquet"

schema:
  id_column: "RECORD_ID"
  target_column: "survived"
  target_type: "binary"
  positive_label: 1
  feature_columns: []                  # [] => auto-load from model_info.json
  meta_columns: ["sex"]
  prediction_columns: []               # [] => derived: survived_prob

sampling:
  use: "all"

shuffling:
  n_shuffles: 50
  shuffle_scope: "global"
  shuffle_method: "permute"
  seed_strategy: "deterministic"

importance:
  enabled: true
  eps: 0.01
  ranking_stat: "mean_record_iqr"

scoring:
  model:
    path: "titanic/runs/model_98a696d7e25a/model.joblib"
  baseline:
    use_existing_predictions: true

performance:
  n_jobs: 1
  shuffle_batch: 10

metric_drop:
  enabled: true
  metrics:
    binary: ["roc_auc", "logloss", "f1", "accuracy", "lift_at_decile"]
  thresholding:
    enabled: true
    method: "fixed_or_prior"
    fixed_threshold: 0.31              # threshold used when the models were built
  ranking_metric:
    name: "roc_auc"
    direction: "higher_is_better"
  lift_settings:
    decile: 1
  summary_stats:
    include: ["mean", "std", "se", "median", "iqr"]

record_outliers:
  enabled: true
  variability_stat: "iqr"
  aggregation_across_features: "mean"
  output_top_outliers:
    enabled: true
    top_n: 50                          # 655 test rows — keep the outlier list short
    include_meta: true
    include_top_features:
      enabled: true
      top_k: 3

bucketing:
  enabled: true
  always_include_all: true
  mode: "within_bucket"                # v1-compatible reshuffle inside each bucket
  bucket_stats:
    enabled: true
  specs:
    - name: "pred_decile"
      by: "prediction"
      columns: "ALL_MODELS"
      scheme: { type: "quantile", q: 10 }
    - name: "pred_top5pct"
      by: "prediction"
      columns: "ALL_MODELS"
      scheme: { type: "top_pct", pct: 0.05 }
    - name: "pred_bottom5pct"
      by: "prediction"
      columns: "ALL_MODELS"
      scheme: { type: "bottom_pct", pct: 0.05 }
    - name: "by_sex"
      by: "meta"
      columns: ["sex"]
      scheme: { type: "categories", min_count: 50, other_label: "__OTHER__" }

stability:
  enabled: true
  resampling:
    method: "bootstrap"
    B: 100
    bootstrap:
      sample_frac: 1.0
  rankings_to_check: ["importance", "metric_drop"]
  metrics:
    top_k_jaccard: { enabled: true, k: 3 }       # only 6 features
    bottom_k_jaccard: { enabled: true, k: 3 }
    spearman: { enabled: true }
    kendall_tau: { enabled: true }
    pairwise_order_consistency: { enabled: true, Z: 0.90 }
  consensus_ranking:
    method: "median_rank"
    tie_breaker: "mean_value"

reporting:
  write_parquet: true
  write_csv: true
  write_markdown_report: true
  report_sections:
    - "baseline_metrics"
    - "baseline_target_distribution"
    - "importance"
    - "metric_drop"
    - "record_outliers"
    - "bucketing"
    - "stability"
  logging:
    level: "INFO"
